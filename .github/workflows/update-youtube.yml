name: Update YouTube feed

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest YouTube videos
        env:
          YOUTUBE_CHANNEL_URL: https://youtube.com/@pannu_core
        run: node scripts/fetch-youtube.mjs

      - name: Commit updated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/youtube.json
          git diff --cached --quiet || git commit -m "chore: update YouTube feed"
          git push
